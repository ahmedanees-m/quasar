repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^quasarstack/
        additional_dependencies: [numpy]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  # The two checks CI runs that this file did not, added after CI's claims step was found
  # failing for a fortnight without anyone noticing. C16 and C17 were marked `pass` while
  # pointing at files that never existed, and the checker said so on every push; `UNRESOLVED`
  # in its output reads like a status word rather than a failure. The manuscript will cite
  # numbers out of docs/results-index.md, so the ledger being trustworthy is not housekeeping.
  #
  # `always_run` with `pass_filenames: false` because both inspect the whole tree, not the
  # staged subset: a claim can be broken by deleting an artefact that is not itself staged.
  - repo: local
    hooks:
      - id: check-claims
        name: every docs/results-index.md row resolves to an artefact that exists
        entry: python scripts/check_claims.py --allow-planned
        language: system
        pass_filenames: false
        always_run: true
      - id: check-provenance
        name: every committed result record came from the pinned image
        entry: python scripts/check_results_provenance.py
        language: system
        pass_filenames: false
        always_run: true

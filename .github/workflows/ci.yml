name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# CI never receives QPU credentials. Tests marked `hardware` are manual only.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check quasarstack experiments scripts tests

      - name: Format check
        run: black --check quasarstack experiments scripts tests

      - name: Types
        run: mypy quasarstack

      - name: Fast tests
        run: pytest -m fast --cov=quasarstack --cov-report=term-missing

      - name: Claims ledger resolves
        run: python scripts/check_claims.py --allow-planned

      - name: Committed results were produced in the pinned image
        run: python scripts/check_results_provenance.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks action derives its scan range from the push event's base commit. That
      # commit is unreachable after any history rewrite, so the range scan fails with
      # "stderr is not empty" having scanned zero bytes, and reports a failure that has
      # nothing to do with whether a secret is present. The binary is invoked directly and
      # pinned instead, scanning the entire history every time. A scan that covers nothing
      # is worse than no scan, because it reports a result.
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1 --report-format sarif --report-path results.sarif

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: results.sarif
          if-no-files-found: ignore

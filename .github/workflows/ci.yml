name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# CI never receives QPU credentials. Tests marked `hardware` are manual only.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check quasarstack experiments scripts tests

      - name: Format check
        run: black --check quasarstack experiments scripts tests

      - name: Types
        run: mypy quasarstack

      - name: Fast tests
        run: pytest -m fast --cov=quasarstack --cov-report=term-missing

      - name: Claims ledger resolves
        run: python scripts/check_claims.py --allow-planned

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
